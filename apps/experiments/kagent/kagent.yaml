apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kagent
  namespace: kagent
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/kagent-dev/kagent/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  interval: 10m
  chart:
    spec:
      chart: kagent
      version: "0.10.4"
      sourceRef:
        kind: HelmRepository
        name: kagent
  install:
    crds: Skip                 # from infrastructure/controllers/kagent-crds
  upgrade:
    crds: Skip
  values:
    providers:
      default: anthropic
      anthropic:
        provider: Anthropic
        model: claude-sonnet-5-5
        apiKeySecretRef: null        # no key; agentgateway adds it
        apiKeySecretKey: null
        config:
          baseUrl: http://agentgateway-proxy.agentgateway-system
    kagent-tools:
      rbac:
        readOnly: true         # get/list/watch, no Secrets; the chart's default is cluster-admin
      tools:
        args: ["--read-only"]  # tools refuse write operations too
    # Only k8s-agent and promql-agent.
    kgateway-agent: {enabled: false}
    istio-agent: {enabled: false}
    observability-agent: {enabled: false}
    argo-rollouts-agent: {enabled: false}
    helm-agent: {enabled: false}
    cilium-policy-agent: {enabled: false}
    cilium-manager-agent: {enabled: false}
    cilium-debug-agent: {enabled: false}
    grafana-mcp: {enabled: false}
