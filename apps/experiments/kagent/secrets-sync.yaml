apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: kagent-secrets
  namespace: kagent
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /kagent
  targets:
    - name: kagent-anthropic
      namespace: kagent
      kind: Secret
      secretType: Opaque
      creationPolicy: Owner
