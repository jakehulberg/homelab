apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: agentgateway-secrets
  namespace: agentgateway-system
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /agentgateway
  targets:
    - name: anthropic-secret     # key: Authorization
      namespace: agentgateway-system
      kind: Secret
      secretType: Opaque
      creationPolicy: Owner
