apiVersion: v1
kind: Namespace
metadata:
  name: openshell
  labels:
    pod-security.kubernetes.io/enforce: restricted   # required by the chart
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: openshell
  namespace: openshell
spec:
  interval: 1h
  url: oci://ghcr.io/nvidia/openshell/helm-chart
  ref:
    tag: "0.1.7"
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
# Needs Agent Sandbox (infrastructure/controllers/agent-sandbox); the chart's preflight checks for it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openshell
  namespace: openshell
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: openshell
