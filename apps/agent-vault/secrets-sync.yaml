apiVersion: v1
kind: Namespace
metadata:
  name: agent-vault
---
# The proxy's token, from Infisical Cloud /agent-vault. The proxy uses it to load its
# settings and CA from the cluster's Infisical on every start.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: agent-vault-secrets
  namespace: agent-vault
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /agent-vault
  targets:
    - name: agent-vault-secrets-infisical
      namespace: agent-vault
      kind: Secret
      secretType: Opaque
      creationPolicy: Owner
