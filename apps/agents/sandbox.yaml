apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    pod-security.kubernetes.io/enforce: restricted  # reject anything privileged in here
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: basic
  namespace: agents
spec:
  # networkPolicy omitted: the controller applies its default, internet egress only
  podTemplate:
    spec:
      automountServiceAccountToken: false  # sandboxes get no Kubernetes API access
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent                      # Airlock execs into the container with this name
          image: busybox:1.37              # placeholder until the real agent image exists
          command: [sleep, infinity]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: basic
  namespace: agents
  annotations:
    airlock.jakehulberg.com/description: Placeholder sandbox, no agent yet  # shown in Airlock's claim form
spec:
  replicas: 1
  sandboxTemplateRef:
    name: basic

