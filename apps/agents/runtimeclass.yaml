# gVisor. runsc is installed on the lima vms on the minis only, not the Pi.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc              # the runtime name in containerd's config
scheduling:
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"   # the minis
