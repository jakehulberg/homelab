apiVersion: v1
kind: Namespace
metadata:
  name: life-dashboard
---
# App settings (weather, YouTube, GitHub, Plaid) from Infisical Cloud /life-dashboard.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: life-dashboard-secrets
  namespace: life-dashboard
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /life-dashboard
  targets:
    - name: life-dashboard-secrets-infisical
      namespace: life-dashboard
      kind: Secret
      secretType: Opaque
      creationPolicy: Owner
---
# Pull secret for the private image on ghcr.io, built from /ghcr GHCR_TOKEN.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: ghcr-pull
  namespace: life-dashboard
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /ghcr
  targets:
    - name: ghcr-pull
      namespace: life-dashboard
      kind: Secret
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"jakehulberg","password":"{{ .GHCR_TOKEN.Value }}"}}}'
---
# Same pull secret for Flux, which checks ghcr.io for new tags from flux-system.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: ghcr-pull
  namespace: flux-system
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /ghcr
  targets:
    - name: ghcr-pull
      namespace: flux-system
      kind: Secret
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"jakehulberg","password":"{{ .GHCR_TOKEN.Value }}"}}}'
