  name: life-dashboard
  namespace: life-dashboard
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - life.home.jakehulberg.com
  rules:
    - backendRefs:
        - name: life-dashboard
          port: 3000
