apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /authentik
  targets:
    - name: authentik-secrets-infisical
      namespace: authentik
      kind: Secret
      secretType: Opaque
      creationPolicy: Owner
