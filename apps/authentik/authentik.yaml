apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 10m
  chart:
    spec:
      chart: authentik
      version: "2026.8.5"
      sourceRef:
        kind: HelmRepository
        name: authentik
  values:
    authentik:
      existingSecret:
        secretName: authentik-secrets-infisical  # AUTHENTIK_SECRET_KEY from Infisical
    global:
      env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-db-rw                 # CloudNativePG's read-write Service
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-db-app             # the Secret CloudNativePG generated
              key: password
