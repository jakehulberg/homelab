apiVersion: v1
kind: Namespace
metadata:
  name: authentik
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
spec:
  instances: 1          # one is enough to start; R2 backups come later
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: authentik
      owner: authentik  # password lands in the authentik-db-app Secret
