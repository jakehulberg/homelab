apiVersion: v1
kind: Namespace
metadata:
  name: airlock
---
# OIDC client, session key and the web-to-orchestrator token, from Infisical Cloud /airlock.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: airlock-secrets
  namespace: airlock
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /airlock
  targets:
    - name: airlock-secrets-infisical
      namespace: airlock
      kind: Secret
      secretType: Opaque
      creationPolicy: Owner
---
# Pull secret for the private images on ghcr.io, built from /ghcr GHCR_TOKEN.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: ghcr-pull
  namespace: airlock
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /ghcr
  targets:
    - name: ghcr-pull
      namespace: airlock
      kind: Secret
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"jakehulberg","password":"{{ .GHCR_TOKEN.Value }}"}}}'

