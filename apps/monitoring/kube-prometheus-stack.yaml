apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "93.1.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: Skip         # CRDS comr from infrastructure/controllers/prometheus-operator-crds
  upgrade:
    crds: Skip         
  values:
    crds:
      enabled: false
    # Built into the k3s process; the chart's default scrapers can't reach them.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    alertmanager:
      alertmanagerSpec:
        secrets:
          - alertmanager-ntfy    # mounted at /etc/alertmanager/secrets/alertmanager-ntfy/
      config:
        route:
          receiver: ntfy
          group_by: [alertname, namespace]
          group_wait: 30s        # wait for related alerts, send them together
          group_interval: 5m
          repeat_interval: 12h   # re-send a still-firing alert twice a day
          routes:
            # Always-firing heartbeat and info-level alerts: no push.
            - receiver: "null"
              matchers: ['alertname=~"Watchdog|InfoInhibitor"']
            - receiver: "null"
              matchers: ['severity="info"']
        receivers:
          - name: "null"
          - name: ntfy
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/NTFY_URL
                send_resolved: true    # also push when it's fixed
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: GRAFANA_ADMIN_USER
        passwordKey: GRAFANA_ADMIN_PASSWORD
    prometheus:
      prometheusSpec:
        retention: 10d
        retentionSize: 4GB       # oldest data dropped past this
        nodeSelector:
          kubernetes.io/hostname: k3s-mini2   # most RAM 
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1536Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 5Gi
        # Pick up ServiceMonitors and rules from every namespace, not just this release's.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
    prometheus-node-exporter:         
      prometheus:                    
        monitor:                       
          relabelings:                 
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: instance  
