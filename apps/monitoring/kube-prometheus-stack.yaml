apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.16.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: Create
  upgrade:
    crds: CreateReplace          # chart upgrades also update its CRDs
  values:
    # Built into the k3s process; the chart's default scrapers can't reach them.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    alertmanager:
      enabled: false             # later, with somewhere to send alerts
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: GRAFANA_ADMIN_USER
        passwordKey: GRAFANA_ADMIN_PASSWORD
    prometheus:
      prometheusSpec:
        retention: 10d
        retentionSize: 4GB       # oldest data dropped past this
        nodeSelector:
          kubernetes.io/hostname: k3s-mini2   # most RAM and disk; mini1 has 15GiB
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1536Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 5Gi
        # Pick up ServiceMonitors and rules from every namespace, not just this release's.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
