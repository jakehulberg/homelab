apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: monitoring-secrets
  namespace: monitoring
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /monitoring
  targets:
    - name: grafana-admin       # Grafana reads its login from here
      namespace: monitoring
      kind: Secret
      secretType: Opaque
      creationPolicy: Owner

