apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: infisical-db-daily
  namespace: infisical
spec:
  schedule: "0 0 3 * * *"        # 3:00 every day; this format has a seconds field first
  backupOwnerReference: self
  cluster:
    name: infisical-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
