apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: infisical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10-alpine
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no"]   # password required, nothing written to disk
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets-infisical
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: infisical
spec:
  selector:
    app: redis
  ports:
    - port: 6379

