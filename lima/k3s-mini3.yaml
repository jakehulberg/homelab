# k3s server VM on mini3. 6GiB, leaving room on the host for Docker (demo Infisical, capped at 6GB).
# Create: limactl create --name=k3s-mini3 lima/k3s-mini3.yaml

vmType: vz
arch: aarch64
cpus: 6
memory: 6GiB
disk: 35GiB

images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64

# No mounts, port forwarding or containerd. The node is reached over Tailscale.
plain: true

# Bridged onto the home LAN through en0 (Ethernet), so the VM gets its own 192.168.1.x address and
# Tailscale connects the nodes directly with no NAT in between. Needs socket_vmnet on the mini
# (docs/bootstrap.md#2-create-the-vms). vzNAT is left from the Wi-Fi setup; Tailscale prefers the
# LAN path.
networks:
  - vzNAT: true
  - lima: bridged

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v tailscale >/dev/null || curl -fsSL https://tailscale.com/install.sh | sh
