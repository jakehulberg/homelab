# k3s server VM on mini2. mini2 is mostly idle, so this VM is the largest.
# Create: limactl create --name=k3s-mini2 lima/k3s-mini2.yaml

vmType: vz
arch: aarch64
cpus: 6
memory: 10GiB
disk: 50GiB

images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64

# No mounts, port forwarding or containerd. The node is reached over Tailscale.
plain: true

# Apple's VM NAT. Lima's default user-mode network is a "hard" NAT (Tailscale netcheck shows
# MappingVariesByDestIP: true), which forces node-to-node traffic through Tailscale's relay servers.
# With vzNAT, Tailscale connects the nodes directly.
networks:
  - vzNAT: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v tailscale >/dev/null || curl -fsSL https://tailscale.com/install.sh | sh
