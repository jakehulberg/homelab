apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  infisicalAuthRef:
    name: homelab-cluster
    namespace: infisical-operator-system
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab
      environmentSlug: dev
      secretPath: /cert-manager
  targets:
    - name: cloudflare-api-token-infisical   # new name, so it can't collide with the SOPS one
      namespace: cert-manager
      kind: Secret
      secretType: Opaque
      creationPolicy: Owner
