apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  url: oci://ghcr.io/traefik/helm/traefik
  ref:
    tag: "42.1.3"              # exact version, so upgrades only happen when you change this
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: traefik
  values:
    providers:
      kubernetesGateway:
        enabled: true          # watch Gateway and HTTPRoute objects
    gateway:
      listeners:
        web:
          namespacePolicy:
            from: All          # let routes in any namespace (like podinfo) use this Gateway

