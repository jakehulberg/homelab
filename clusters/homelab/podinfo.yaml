apiVersion: v1
kind: Namespace
metadata:
  name: podinfo
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: podinfo
  namespace: podinfo
spec:
  interval: 1h                                   # how often to check for new chart versions
  url: oci://ghcr.io/stefanprodan/charts/podinfo # where the chart lives
  ref:
    semver: ">=6.0.0"                            # which version to use
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: podinfo
spec:
  interval: 10m          # how often to re-check the release matches git
  chartRef:
    kind: OCIRepository  # use the chart fetched above
    name: podinfo
  values:                # same as a Helm values.yaml
    replicaCount: 2
